name: GSU Warder Evolution
on:
  push:
    branches: [main, original-python314]
    paths: ['plugin/**', 'restoration/update/**', '.github/workflows/original-python314.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gsu-original-release
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - name: Verify plugin interfaces and compatibility
        run: |
          python --version
          python -m compileall -q plugin/src
          python -m unittest discover -s plugin/tests -v
      - name: Build receiver candidate twice and compare
        run: |
          python plugin/tools/build_ipk.py --output plugin/dist
          VERSION=$(cat plugin/src/GlassSysUtil/version)
          PACKAGE="plugin/dist/enigma2-plugin-extensions-gsu_${VERSION}_all.ipk"
          cp "$PACKAGE" /tmp/first.ipk
          python plugin/tools/build_ipk.py --output plugin/dist
          cmp /tmp/first.ipk "$PACKAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: GSU-Warder-Evolution-IPK
          path: plugin/dist/*
          retention-days: 90
      - name: Publish verified IPK and synchronize update feeds
        if: github.ref == 'refs/heads/original-python314'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python -c "import json,pathlib,sys; sys.path.insert(0,'plugin/src/GlassSysUtil'); from plugin_update import version_key; sys.exit(0 if version_key(pathlib.Path('plugin/src/GlassSysUtil/version').read_text().strip()) >= version_key(json.loads(pathlib.Path('plugin/update/stable.json').read_text())['release']['version']) else 1)"; then
            echo 'Preserving the newer verified stable release; this source build cannot downgrade the feed.'
            exit 0
          fi
          python plugin/tools/publish_group_release.py
          git add plugin/update/candidate.json plugin/update/stable.json restoration/update/candidate.json PRODUCTION.json reports/plugin-groups-20261030.json
          if ! git diff --cached --quiet; then
            git -c user.name='Warder release automation' -c user.email='warder-release@users.noreply.github.com' commit -m 'Record verified GSU release and compatible update feeds'
            git push origin HEAD:original-python314
          fi
