name: Promote approved receiver repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/promote-approved-repair.yml, docs/APPROVED-REPAIR-RELEASE.md]
permissions:
  contents: read
concurrency:
  group: approved-receiver-repair
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Evolution-by-Warder/GSU-Warder-Evolution
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable public IPK and checksum before promotion
        run: |
          set -euo pipefail
          mkdir /tmp/approved-repair
          gh release download 'v13.40-r95' --pattern 'enigma2-plugin-extensions-gsu_13.40-r95_all.ipk' --pattern 'enigma2-plugin-extensions-gsu_13.40-r95_all.ipk.sha256' --dir /tmp/approved-repair
          test "$(stat -c %s '/tmp/approved-repair/enigma2-plugin-extensions-gsu_13.40-r95_all.ipk')" = '3689270'
          printf '%s  %s\n' '370e6a26fed222616944f226d50dc30c1de66b44debb606468efc288058904a3' '/tmp/approved-repair/enigma2-plugin-extensions-gsu_13.40-r95_all.ipk' | sha256sum --check
          cd /tmp/approved-repair
          sha256sum --check 'enigma2-plugin-extensions-gsu_13.40-r95_all.ipk.sha256'
      - name: Promote existing release without rebuilding or replacing assets
        run: |
          set -euo pipefail
          gh release edit 'v13.40-r95' --draft=false --prerelease=false --latest --notes-file docs/APPROVED-REPAIR-RELEASE.md
          gh release view 'v13.40-r95' --json tagName,isDraft,isPrerelease,assets
